services:
  flowise:
    container_name: flowise
    build:
      context: ./connexpay
      dockerfile: services/flowise/Dockerfile
    ports:
      - 0.0.0.0:3001:3001

  open-webui:
    container_name: open-webui
    build:
      context: ./connexpay
      dockerfile: services/open-webui/Dockerfile
    ports:
      - 0.0.0.0:8080:8080
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434 # Connect to container named 'ollama'
      - USE_OLLAMA_DOCKER=true

  n8n:
    container_name: n8n
    build:
      context: ./connexpay
      dockerfile: services/n8n/Dockerfile
    ports:
      - 0.0.0.0:5678:5678

  n8n-import:
    container_name: n8n-import
    build:
      context: ./connexpay
      dockerfile: services/n8n-import/Dockerfile

  qdrant:
    container_name: qdrant
    build:
      context: ./connexpay
      dockerfile: services/qdrant/Dockerfile
    ports:
      - 127.0.0.1:6333:6333
      - 127.0.0.1:6334:6334

  neo4j:
    container_name: neo4j
    build:
      context: ./connexpay
      dockerfile: services/neo4j/Dockerfile
    ports:
      - 127.0.0.1:7473:7473
      - 127.0.0.1:7474:7474
      - 127.0.0.1:7687:7687

  caddy:
    container_name: caddy
    build:
      context: ./connexpay
      dockerfile: services/caddy/Dockerfile
    ports:
      - 127.0.0.1:18080:80
      - 127.0.0.1:18443:443
    expose:
      - 2019/tcp
      - 443/udp

  langfuse-worker:
    container_name: langfuse-worker
    build:
      context: ./connexpay
      dockerfile: services/langfuse-worker/Dockerfile
    ports:
      - 127.0.0.1:3030:3030
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      NVIDIA_VISIBLE_DEVICES: all

  langfuse-web:
    container_name: langfuse-web
    build:
      context: ./connexpay
      dockerfile: services/langfuse-web/Dockerfile
    ports:
      - 127.0.0.1:3000:3000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      NVIDIA_VISIBLE_DEVICES: all

  clickhouse:
    container_name: clickhouse
    build:
      context: ./connexpay
      dockerfile: services/clickhouse/Dockerfile
    ports:
      - 127.0.0.1:8123:8123
      - 127.0.0.1:19000:9000
      - 127.0.0.1:19009:9009
    expose:
      - 8123/tcp
      - 19000/tcp
      - 19009/tcp
    environment:
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
      - MAX_MEMORY_USAGE=2000000000 # 2GB limit

  minio:
    ports:
      - 127.0.0.1:19010:9000
      - 127.0.0.1:19011:9001

  postgres:
    container_name: postgres
    build:
      context: ./connexpay
      dockerfile: services/postgres/Dockerfile
    ports:
      - 127.0.0.1:5433:5432

  redis:
    container_name: redis
    build:
      context: ./connexpay
      dockerfile: services/redis/Dockerfile
    ports:
      - 127.0.0.1:6379:6379

  searxng:
    container_name: searxng
    build:
      context: ./connexpay
      dockerfile: services/searxng/Dockerfile
    volumes:
      - ./connexpay/searxng:/etc/searxng:rw
    ports:
      - 127.0.0.1:8081:8080

  ollama-gpu:
    container_name: ollama
    build:
      context: ./connexpay
      dockerfile: services/ollama/Dockerfile
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility

  ollama-pull-llama-gpu:
    container_name: ollama-pull-llama
    build:
      context: ./connexpay
      dockerfile: services/ollama-pull-llama/Dockerfile
    volumes:
      - ollama_storage:/root/.ollama
    entrypoint: /bin/sh
    command:
      - "-c"
      - "sleep 3; OLLAMA_HOST=ollama:11434 ollama pull qwen2.5:7b-instruct-q4_K_M; OLLAMA_HOST=ollama:11434 ollama pull nomic-embed-text"
    depends_on:
      - ollama-gpu
